<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" shape-rendering="geometricPrecision">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#ff8aa5" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff8aa5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff8aa5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- pink halo behind the strawberry; signals "active / hoverable" -->
  <circle cx="20" cy="22" r="18" fill="url(#glow)"/>

  <!-- whole strawberry tilted, perked up -->
  <g filter="url(#s)" transform="rotate(-14 20 22)">
    <!-- body -->
    <path
      d="M11.5 13.4
         C 10 17.2, 9.6 22.2, 13 27.2
         C 16.5 31.2, 24 31.7, 28 26.7
         C 31 23, 31.5 17.7, 29 14.2
         C 26.5 11, 21.5 11.2, 18 11.8
         C 15 12.2, 12.4 11.7, 11.5 13.4 Z"
      fill="#ef4a6c"
      stroke="#6b1b33"
      stroke-width="1.6"
      stroke-linejoin="round"/>

    <!-- leafy crown -->
    <path
      d="M19.2 5
         L 22.6 7.8
         L 27 5
         L 26.2 9.8
         L 30.4 9.6
         L 27.4 13
         L 30.6 15.6
         L 25.8 15.4
         L 24.6 18.6
         L 21.8 15.4
         L 18.6 17.2
         L 18.9 12.2
         L 14.6 12.4
         L 16.6 8.8
         L 14 6
         L 18 6.6 Z"
      fill="#b3df7e"
      stroke="#3f6c2a"
      stroke-width="1.4"
      stroke-linejoin="round"/>

    <!-- leaf highlight -->
    <path
      d="M22 7.6 C 23.2 9, 23.6 10.8, 23 12"
      fill="none"
      stroke="#dbf2b6"
      stroke-width="0.9"
      stroke-linecap="round"
      opacity="0.85"/>

    <!-- seeds -->
    <ellipse cx="15.8" cy="20.6" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="20.4" cy="22.4" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="24.2" cy="20.8" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="17.6" cy="25.2" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="22.4" cy="26.6" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="26.4" cy="24.4" rx="0.95" ry="1.15" fill="#fff"/>

    <!-- body highlight -->
    <path
      d="M13.4 15.8 C 12.2 18.2, 12 20.6, 12.8 22.6"
      fill="none"
      stroke="#ffd2dd"
      stroke-width="1.1"
      stroke-linecap="round"
      opacity="0.75"/>
  </g>

  <!-- twinkle/sparkle in the upper-right corner — the "you can click this" cue -->
  <g transform="translate(31 8)">
    <path
      d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"
      fill="#fff5b8"
      stroke="#d9a64a"
      stroke-width="0.7"
      stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="0.7" fill="#fff"/>
  </g>

  <!-- tiny secondary sparkle for extra delight -->
  <g transform="translate(7 11)" opacity="0.85">
    <path
      d="M0 -2 L0.6 -0.6 L2 0 L0.6 0.6 L0 2 L-0.6 0.6 L-2 0 L-0.6 -0.6 Z"
      fill="#ffe2eb"
      stroke="#c87a92"
      stroke-width="0.5"
      stroke-linejoin="round"/>
  </g>
</svg>
