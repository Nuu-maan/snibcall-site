<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" shape-rendering="geometricPrecision">
  <!-- subtle drop shadow so the cursor lifts off any background -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.7" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#s)">
    <!-- body: rounded teardrop, tilted -->
    <path
      d="M9.5 13.2
         C 8 17, 7.6 22, 11 27
         C 14.5 31, 22 31.5, 26 26.5
         C 29 22.8, 29.5 17.5, 27 14
         C 24.5 10.8, 19.5 11, 16 11.6
         C 13 12, 10.4 11.5, 9.5 13.2 Z"
      fill="#ef4a6c"
      stroke="#6b1b33"
      stroke-width="1.6"
      stroke-linejoin="round"/>

    <!-- leafy crown: layered green star -->
    <path
      d="M17.2 4.8
         L 20.6 7.6
         L 25 4.8
         L 24.2 9.6
         L 28.4 9.4
         L 25.4 12.8
         L 28.6 15.4
         L 23.8 15.2
         L 22.6 18.4
         L 19.8 15.2
         L 16.6 17
         L 16.9 12
         L 12.6 12.2
         L 14.6 8.6
         L 12 5.8
         L 16 6.4 Z"
      fill="#b3df7e"
      stroke="#3f6c2a"
      stroke-width="1.4"
      stroke-linejoin="round"/>

    <!-- tiny highlight on a leaf -->
    <path
      d="M20 7.4 C 21.2 8.8, 21.6 10.6, 21 11.8"
      fill="none"
      stroke="#dbf2b6"
      stroke-width="0.9"
      stroke-linecap="round"
      opacity="0.85"/>

    <!-- seed dots -->
    <ellipse cx="13.8" cy="20.4" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="18.4" cy="22.2" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="22.2" cy="20.6" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="15.6" cy="25.0" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="20.4" cy="26.4" rx="0.95" ry="1.15" fill="#fff"/>
    <ellipse cx="24.4" cy="24.2" rx="0.95" ry="1.15" fill="#fff"/>

    <!-- specular highlight on body -->
    <path
      d="M11.4 15.6 C 10.2 18, 10 20.4, 10.8 22.4"
      fill="none"
      stroke="#ffd2dd"
      stroke-width="1.1"
      stroke-linecap="round"
      opacity="0.75"/>
  </g>
</svg>
